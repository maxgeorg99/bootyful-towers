name: Build Linux Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .love package
        run: |
          # Create game.love by zipping all game files (excluding test dependencies)
          zip -r game.love . \
            -x "*.git*" \
            -x "*lovejs*" \
            -x "*itch-build*" \
            -x "*.love" \
            -x "*.zip" \
            -x ".github/*" \
            -x ".claude/*" \
            -x ".idea/*" \
            -x "packages/luassert/*"

      - name: Upload .love package
        uses: actions/upload-artifact@v4
        with:
          name: game-love-package-linux
          path: game.love

  build-linux:
    needs: build-game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download .love package
        uses: actions/download-artifact@v4
        with:
          name: game-love-package-linux

      - name: Build Linux AppImage
        uses: love-actions/love-actions-linux@v1
        with:
          love-package: ./game.love
          product-name: BootyfulTowers
          output-folder: ./build
          app-id: com.bootyful.towers
          description: "Bootyful Towers - A Tower Defense Game"
          version-string: "1.0.0"
          icon-path: ./icon.png

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ./build/*.AppImage

      - name: Install Butler
        if: github.ref == 'refs/heads/master'
        run: |
          # Download butler for Linux
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default

          # Extract butler
          unzip butler.zip

          # Make butler executable
          chmod +x butler

          # Verify installation
          ./butler -V

      - name: Deploy to itch.io
        if: github.ref == 'refs/heads/master'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          ./butler push ./build/*.AppImage "${{ secrets.ITCH_USER }}/bootyful-towers:linux" --userversion "${{ github.sha }}"
