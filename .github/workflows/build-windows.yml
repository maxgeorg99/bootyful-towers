name: Build Windows Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .love package
        run: |
          # Create game.love by zipping all game files (excluding test dependencies)
          zip -r game.love . \
            -x "*.git*" \
            -x "*lovejs*" \
            -x "*itch-build*" \
            -x "*.love" \
            -x "*.zip" \
            -x ".github/*" \
            -x ".claude/*" \
            -x ".idea/*" \
            -x "packages/luassert/*" \

      - name: Upload .love package
        uses: actions/upload-artifact@v4
        with:
          name: game-love-package
          path: game.love

  build-windows:
    needs: build-game
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download .love package
        uses: actions/download-artifact@v4
        with:
          name: game-love-package

      - name: Build Windows packages
        uses: love-actions/love-actions-windows@v1
        with:
          love-package: ./game.love
          product-name: BootyfulTowers
          output-folder: ./build

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ./build/*

      - name: Install Butler
        if: github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          # Download butler for Windows
          Invoke-WebRequest -Uri "https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default" -OutFile "butler.zip"
          
          # Extract butler
          Expand-Archive -Path "butler.zip" -DestinationPath "." -Force
          
          # Verify installation
          ./butler.exe -V

      - name: Deploy to itch.io
        if: github.ref == 'refs/heads/master'
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          # Butler will automatically use BUTLER_API_KEY environment variable
          ./butler.exe push ./build "${{ secrets.ITCH_USER }}/bootyful-towers:windows" --userversion "${{ github.sha }}"
